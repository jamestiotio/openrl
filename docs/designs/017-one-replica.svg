<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="ot" class="arch" role="img" viewBox="0 0 1200 548"><title id="ot">A pool with one replica</title><style>.arch{width:100%;height:auto;display:block;background:#fbfcfd}.box rect{fill:#fff;stroke:#9aa3ae;stroke-width:1.2}.box.store rect{fill:#f3f5f8}.box.gpu rect{fill:#eef4fb;stroke:#7d9cc4}.box.accent rect{fill:#efedfa;stroke:#2f2a8a;stroke-width:1.6}.box.optional rect,.group{fill:#fff;stroke:#9aa3ae;stroke-width:1.2;stroke-dasharray:5 4}.group{fill:none;stroke:#b9c0c8}.cluster{fill:none;stroke:#7a828d;stroke-width:1.4}.bs,.bt,.mono{text-anchor:middle}.bt{font-size:14px;font-weight:600;fill:#16191d}.bs{font-size:12px;fill:#4d5560}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#2f2a8a}.gt{font-size:13px;font-weight:600;fill:#4d5560}.ct{font-size:15px;font-weight:650;fill:#16191d}.note{font-size:12px;fill:#4d5560}.flow,.side{fill:none;stroke:#16191d;stroke-width:1.4}.side{stroke:#8a929c;stroke-width:1.3;stroke-dasharray:4 3}.ahead{fill:#16191d}.lbl{font-size:11.5px;fill:#4d5560;paint-order:stroke;stroke:#fbfcfd;stroke-width:4px;stroke-linejoin:round}text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><defs><marker id="o1" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker><marker id="o2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8a929c" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="box"><rect width="130" height="70" x="16" y="200" rx="6"/><text x="81" y="228" class="bt">Training loop</text><text x="81" y="246" class="bs">tinker SDK</text></g><rect width="1008" height="516" x="176" y="16" class="cluster" rx="12"/><text x="196" y="44" class="ct">GKE cluster</text><g class="box accent"><rect width="170" height="90" x="200" y="190" rx="6"/><text x="285" y="214" class="bt">API server</text><text x="285" y="236" class="bs">ensure(model, &quot;sampler&quot;)</text><text x="285" y="252" class="bs">on the first save or</text><text x="285" y="268" class="bs">sampling session</text></g><g class="box"><rect width="200" height="64" x="420" y="64" rx="6"/><text x="520" y="88" class="bt">Sampler Workload</text><text x="520" y="108" class="bs">one replica</text></g><g class="box"><rect width="190" height="64" x="680" y="64" rx="6"/><text x="775" y="88" class="bt">OpenRL scheduler</text><text x="775" y="108" class="bs">DRA claim, then pod</text></g><g class="box store"><rect width="170" height="92" x="200" y="396" rx="6"/><text x="285" y="420" class="bt">Redis</text><text x="285" y="440" class="mono">open_rl:sampling:&lt;pool&gt;</text><text x="285" y="458" class="bs">read without removal</text><text x="285" y="476" class="mono">open_rl:future:&lt;id&gt;</text></g><rect width="600" height="312" x="568" y="160" class="group" rx="10"/><text style="text-anchor:end" x="1152" y="182" class="gt">GPU node</text><g class="box gpu"><rect width="320" height="252" x="592" y="196" rx="8"/><text x="752" y="220" class="bt">Sampler pod</text><text x="752" y="240" class="mono">python -m server.vllm_sampler --pool &lt;pool&gt;</text></g><g class="box"><rect width="280" height="56" x="612" y="260" rx="6"/><text x="752" y="284" class="bt">Dispatcher loop</text><text x="752" y="302" class="bs">read, generate, set_result</text></g><g class="box"><rect width="280" height="76" x="612" y="352" rx="6"/><text x="752" y="376" class="bt">vLLM engine, in this process</text><text x="752" y="396" class="mono">vllm_sampler.Sampler</text><text x="752" y="414" class="bs">loads each revision between batches</text></g><rect width="214" height="252" x="938" y="196" class="group" rx="8"/><text x="1045" y="216" class="bs">Only when it shares</text><text x="1045" y="232" class="bs">its trainer&apos;s GPU</text><g class="box optional"><rect width="182" height="64" x="954" y="252" rx="6"/><text x="1045" y="278" class="bt">Trainer pod</text><text x="1045" y="296" class="bs">FFT on one GPU</text></g><g class="box optional"><rect width="182" height="76" x="954" y="352" rx="6"/><text x="1045" y="378" class="bt">Time slicer</text><text x="1045" y="396" class="bs">one turn around</text><text x="1045" y="412" class="bs">each batch</text></g><path marker-end="url(#o1)" d="M146,235 H200" class="flow"/><text x="173" y="227" class="lbl" text-anchor="middle">asample</text><path marker-end="url(#o1)" d="M370,205 H394 V96 H420" class="flow"/><text x="394" y="150" class="lbl" text-anchor="middle">creates</text><path marker-end="url(#o1)" d="M620,96 H680" class="flow"/><text x="650" y="88" class="lbl" text-anchor="middle">reads</text><path marker-end="url(#o1)" d="M775,128 V196" class="flow"/><text x="783" y="152" class="lbl">creates pod</text><path marker-end="url(#o1)" d="M285,280 V396" class="flow"/><text x="293" y="342" class="lbl">XADD</text><path marker-end="url(#o1)" marker-start="url(#o1)" d="M370,442 H530 V288 H612" class="flow"/><text x="530" y="372" class="lbl" text-anchor="middle">read, set_result</text><path marker-end="url(#o1)" d="M752,316 V352" class="flow"/><text x="760" y="338" class="lbl">generate</text><path marker-end="url(#o2)" marker-start="url(#o2)" d="M912,390 H954" class="side"/><path marker-end="url(#o2)" marker-start="url(#o2)" d="M1045,316 V352" class="side"/><text x="200" y="516" class="note">No router, no Deployment, no NetworkPolicy. The replica runs the dispatcher loop itself.</text></svg>